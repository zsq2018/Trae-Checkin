name: Trae 每日签到

# 上游 wallechfox/Trae-Checkin 的 README 描述了云端签到，但仓库里没有提交
# 这个 workflow 文件，这里按 README 的说明补齐，并额外加了：
#   • 飞书群机器人通知（成功/已签/失败三种口径严格区分，见 notify_feishu.py；
#     脚本自带的 webhook 是企微格式，飞书不收）
#   • 每月保活提交，避免 GitHub 因长期无提交暂停定时任务
#
# 依赖的仓库 Secret：
#   TRAE_ACCOUNTS   必填，accounts.json 里 accounts 数组那一整段 JSON
#   FEISHU_WEBHOOK  选填，飞书群「自定义机器人」的 webhook 地址
#   QYWX_TOKEN / PLUSPLUS_TOKEN / TRAE_WEBHOOK  选填，脚本自带的其他推送

on:
  schedule:
    # GitHub 的 schedule 一律按 UTC。
    #   '23 16 * * *' = 北京时间次日 00:23（主轮，脚本作者实测成功率最高的窗口）
    #   '23 17 * * *' = 北京时间次日 01:23（补签轮）
    # 加补签轮的原因：脚本遇到 9074 是「不重试、记 30 分钟冷却、交给下一轮 cron」，
    # 只跑一次的话撞上 9074 / 网络抖动就白丢一天。两轮间隔 60 分 > 30 分冷却，
    # 且签到是幂等的（已领到的一轮之后只会查询、不会重复领）。
    - cron: '23 16 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write      # 仅「保活」提交需要写权限；其余步骤都不写仓库

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # refreshToken 每次续期都会产生新值、旧值随即作废，而 Actions 的工作目录
      # 是一次性的。必须把续期后的新 token 用缓存带到下一次运行，否则第二次
      # 运行就会拿 TRAE_ACCOUNTS 里那份已经作废的 token 去登录，必然失败。
      # key 带 run_id 是为了每次都写入一份新缓存（同名缓存不可覆盖），
      # restore-keys 负责下次取回最近的那一份。
      - name: 恢复 token 缓存
        uses: actions/cache@v6
        with:
          # .trae_state.json 是脚本的「今日已完成」记账：把它一起缓存后，
          # 补签轮会直接跳过（只查询、不重复领），通知也不会重复推送。
          path: |
            .trae_token_cache.json
            .trae_state.json
          key: trae-token-${{ github.run_id }}
          restore-keys: |
            trae-token-

      - name: 执行签到（签到前后各读一次余额）
        id: checkin
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
          QYWX_TOKEN: ${{ secrets.QYWX_TOKEN }}
          PLUSPLUS_TOKEN: ${{ secrets.PLUSPLUS_TOKEN }}
          TRAE_WEBHOOK: ${{ secrets.TRAE_WEBHOOK }}
        run: |
          set -o pipefail
          python checkin_with_balance.py 2>&1 | tee checkin.log

      # always()：签到失败时这条也要跑，否则失败没人知道（除了 GitHub 邮件）。
      # 注意：不看进程退出码 —— 脚本在「今日已签」和「9074 冷却」时都退出 0，
      # 按退出码发通知会把「本次根本没领到积分」说成「签到成功」。
      # notify_feishu.py 改为从日志汇总行反推，三种口径严格互斥，见该文件注释。
      - name: 飞书通知（严格口径）
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python notify_feishu.py --log checkin.log --delta-file .balance_delta.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # GitHub 会在仓库连续 60 天无提交时暂停定时任务（定时任务一停就不会有
      # 失败通知，属于静默死亡）。每月 1 号成功签到后提交一次时间戳保活。
      - name: 保活提交（每月 1 号）
        if: github.event_name == 'schedule' && steps.checkin.outcome == 'success'
        run: |
          if [ "$(TZ=Asia/Shanghai date +%d)" != "01" ]; then
            echo "非每月 1 号，跳过保活提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%F)" || exit 0
          git push
