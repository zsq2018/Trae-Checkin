name: Trae 每日签到

# 上游 wallechfox/Trae-Checkin 的 README 描述了云端签到，但仓库里没有提交
# 这个 workflow 文件，这里按 README 的说明补齐，并额外加了：
#   • 飞书群机器人通知（成功/失败都推，脚本自带的 webhook 是企微格式，飞书不收）
#   • 每月保活提交，避免 GitHub 因长期无提交暂停定时任务
#
# 依赖的仓库 Secret：
#   TRAE_ACCOUNTS   必填，accounts.json 里 accounts 数组那一整段 JSON
#   FEISHU_WEBHOOK  选填，飞书群「自定义机器人」的 webhook 地址
#   QYWX_TOKEN / PLUSPLUS_TOKEN / TRAE_WEBHOOK  选填，脚本自带的其他推送

on:
  schedule:
    # GitHub 的 schedule 一律按 UTC。23 16 * * * = 北京时间次日 00:23。
    # 避开整点（00:00~00:10 最挤），实测 00:15~00:45 成功率最高。
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write      # 仅「保活」提交需要写权限；其余步骤都不写仓库

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # refreshToken 每次续期都会产生新值、旧值随即作废，而 Actions 的工作目录
      # 是一次性的。必须把续期后的新 token 用缓存带到下一次运行，否则第二次
      # 运行就会拿 TRAE_ACCOUNTS 里那份已经作废的 token 去登录，必然失败。
      # key 带 run_id 是为了每次都写入一份新缓存（同名缓存不可覆盖），
      # restore-keys 负责下次取回最近的那一份。
      - name: 恢复 token 缓存
        uses: actions/cache@v6
        with:
          path: .trae_token_cache.json
          key: trae-token-${{ github.run_id }}
          restore-keys: |
            trae-token-

      - name: 执行签到
        id: checkin
        env:
          TRAE_ACCOUNTS: ${{ secrets.TRAE_ACCOUNTS }}
          QYWX_TOKEN: ${{ secrets.QYWX_TOKEN }}
          PLUSPLUS_TOKEN: ${{ secrets.PLUSPLUS_TOKEN }}
          TRAE_WEBHOOK: ${{ secrets.TRAE_WEBHOOK }}
        run: |
          set -o pipefail
          python 03_checkin.py 2>&1 | tee checkin.log

      # always()：签到失败时这条也要跑，否则失败没人知道（除了 GitHub 邮件）
      - name: 飞书通知
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          OUTCOME: ${{ steps.checkin.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过飞书通知"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            ICON="✅"; TITLE="Trae 每日签到成功"
          else
            ICON="❌"; TITLE="Trae 每日签到失败，需要处理"
          fi
          SUMMARY="$(tail -n 12 checkin.log 2>/dev/null || echo '（无日志）')"
          TEXT="$(printf '%s %s\n时间：%s\n\n%s\n\n日志：%s' \
            "$ICON" "$TITLE" "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" "$SUMMARY" "$RUN_URL")"
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' > payload.json
          echo "--- 飞书返回 ---"
          curl -sS -X POST "$FEISHU_WEBHOOK" -H 'Content-Type: application/json' --data-binary @payload.json
          echo

      # GitHub 会在仓库连续 60 天无提交时暂停定时任务（定时任务一停就不会有
      # 失败通知，属于静默死亡）。每月 1 号成功签到后提交一次时间戳保活。
      - name: 保活提交（每月 1 号）
        if: github.event_name == 'schedule' && steps.checkin.outcome == 'success'
        run: |
          if [ "$(TZ=Asia/Shanghai date +%d)" != "01" ]; then
            echo "非每月 1 号，跳过保活提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%F)" || exit 0
          git push
